name: "🐛 Rapport de bug"
description: "Signaler un comportement inattendu"
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: context
    attributes:
      label: Contexte
      description: Décrivez brièvement le contexte du bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Listez les étapes de reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Résultat observé
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      description: Comment valider que le correctif est complet ?
