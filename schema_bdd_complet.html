
<style>
#erd { padding: 8px 0; }
#erd svg { width: 100% !important; height: auto !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryBorderColor: dark ? '#7F77DD' : '#534AB7',
    primaryTextColor: dark ? '#EEEDFE' : '#3C3489',
    secondaryColor: dark ? '#085041' : '#E1F5EE',
    secondaryBorderColor: dark ? '#1D9E75' : '#0F6E56',
    tertiaryColor: dark ? '#444441' : '#F1EFE8',
    tertiaryBorderColor: dark ? '#888780' : '#5F5E5A',
  },
});
const diagramSrc = `erDiagram
  CLASSIFICATION_OBJET {
    uuid id PK
    string wikidata_ref
    string nom_fr
    text formule_latex
    string nature
  }
  CLASSIFICATION_VARIABLE {
    uuid id PK
    uuid objet_id FK
    char lettre
    string wikidata_ref
  }
  SOURCE {
    uuid id PK
    date date
    string lieu
    string auteur
    string environnement
  }
  DONNEE {
    uuid id PK
    jsonb contenu
  }
  SOURCE_DONNEE {
    uuid source_id FK
    uuid donnee_id FK
  }
  DONNEE_RELATION {
    uuid donnee_a_id FK
    uuid donnee_b_id FK
  }
  FORMULE_MATHS {
    uuid id PK
    string intitule
    string symbole
    text formule_latex
    text demonstration_latex
    boolean est_axiome
  }
  FORMULE_MATHS_UTILISATION {
    uuid id PK
    uuid formule_maths_id FK
    uuid reference_id FK
    string nom_reference_dans_demonstration
  }
  HYPOTHESE {
    uuid id PK
    text formule_latex
    float statut
  }
  HYPOTHESE_VARIABLE {
    uuid hypothese_id FK
    char lettre
    uuid classification_id FK
  }
  HYPOTHESE_POUR {
    uuid hypothese_id FK
    uuid donnee_id FK
  }
  HYPOTHESE_CONTRE {
    uuid hypothese_id FK
    uuid donnee_id FK
  }

  CLASSIFICATION_OBJET ||--o{ CLASSIFICATION_VARIABLE : "variables"
  SOURCE ||--o{ SOURCE_DONNEE : "produit"
  DONNEE ||--o{ SOURCE_DONNEE : "appuyee par"
  DONNEE ||--o{ DONNEE_RELATION : "reliee a"
  FORMULE_MATHS ||--o{ FORMULE_MATHS_UTILISATION : "demonstration"
  FORMULE_MATHS ||--o{ FORMULE_MATHS_UTILISATION : "referencee"
  HYPOTHESE ||--o{ HYPOTHESE_VARIABLE : "variables"
  CLASSIFICATION_OBJET ||--o{ HYPOTHESE_VARIABLE : "represente"
  HYPOTHESE ||--o{ HYPOTHESE_POUR : "pour"
  HYPOTHESE ||--o{ HYPOTHESE_CONTRE : "contre"
  DONNEE ||--o{ HYPOTHESE_POUR : "soutient"
  DONNEE ||--o{ HYPOTHESE_CONTRE : "refute"
`;
try {
  const { svg } = await mermaid.render('erd-svg', diagramSrc);
  document.getElementById('erd').innerHTML = svg;

  document.querySelectorAll('#erd svg .node').forEach(node => {
    const firstPath = node.querySelector('path[d]');
    if (!firstPath) return;
    const d = firstPath.getAttribute('d');
    const nums = d.match(/-?[\d.]+/g)?.map(Number);
    if (!nums || nums.length < 8) return;
    const xs = [nums[0], nums[2], nums[4], nums[6]];
    const ys = [nums[1], nums[3], nums[5], nums[7]];
    const x = Math.min(...xs), y = Math.min(...ys);
    const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', w); rect.setAttribute('height', h);
    rect.setAttribute('rx', '8');
    for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
      if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
    }
    firstPath.replaceWith(rect);
  });
  document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
    p.setAttribute('stroke', 'none');
  });
} catch(e) {
  document.getElementById('erd').innerHTML = '<p style="color:var(--color-text-secondary);padding:16px">Erreur de rendu du diagramme.</p>';
}
</script>
